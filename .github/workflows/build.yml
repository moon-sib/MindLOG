name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Liquid Glass (iOS 26) собирается только свежим Xcode. Если runner "macos-26"
    # недоступен, поменяй на macos-15: приложение соберётся, но со «старым» стеклом.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project MindLog.xcodeproj -scheme MindLog \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MindLog.app Payload/
          zip -r MindLog-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MindLog-ipa
          path: MindLog-unsigned.ipa
